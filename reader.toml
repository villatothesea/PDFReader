id = "mireader.pdf"
name = "PDF"
version = "0.1.0"
protocol = 1
executable = "mireader-reader-pdf"
extensions = ["pdf"]
description = "Portable Document Format, rendered with hayro; converts a text-based PDF to Markdown or plain text, saves its pages as images, and extracts, reorders, splits and merges pages into new PDFs."
license = "MIT (MiReader); hayro: MIT/Apache-2.0; pdfcraft: MIT/Apache-2.0"

# MimiReader round 18: Convert to Markdown, from the retired PDFInspector
# (headings, paragraphs, lists and simple tables; scanned PDFs are refused).
# Its Markdown is written beside the original.

[[actions]]
id = "pdf-to-markdown"
title = "Convert to Markdown"
icon = "markdown"
extensions = ["pdf"]
output = "md"

# MimiReader round 19 (O12, T1 item 2): the text layer as plain text (a form
# feed between pages; a scan is refused, not written empty), and pages as
# PNG images ({stem}-001.png …, 150 DPI unless asked, at most 300).

[[actions]]
id = "pdf-to-text"
title = "Convert to plain text…"
icon = "paragraph"
extensions = ["pdf"]
output = "txt"
[[actions.params]]
id = "pages"
label = "Pages"
kind = "pages"
help = "Empty for every page, or for example 1-3, 7, 10-"

[[actions]]
id = "pdf-to-images"
title = "Save pages as images…"
icon = "gallery"
extensions = ["pdf"]
files = "png"
[[actions.params]]
id = "pages"
label = "Pages"
kind = "pages"
help = "Empty for every page, or for example 1-3, 7, 10-"
[[actions.params]]
id = "dpi"
label = "Resolution (DPI)"
kind = "integer"
default = 150
min = 72
max = 300
help = "150 for reading on screen, 300 for printing"

# Round 17 (O6): the reader's own tools — page organising, moved here from
# PDFInspector. Each writes a new PDF beside the original.

# Round 20 (#197): the whole file written anew — only what the document
# still reaches, packed — and checked by a second reader before it is kept.
# Round 20 (#199): a print layout — a print-ready PDF that opens as the
# preview; printing it prints what it shows.
[[actions]]
id = "print-layout"
title = "Print layout…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "layout"
label = "Layout"
kind = "choice"
choices = ["1 page per sheet", "2 pages per sheet", "4 pages per sheet", "6 pages per sheet", "9 pages per sheet", "16 pages per sheet", "Booklet", "Poster"]
default = "1 page per sheet"
[[actions.params]]
id = "paper"
label = "Paper"
kind = "choice"
choices = ["Same as the pages", "A4", "US Letter", "A3", "US Legal", "A5", "Tabloid"]
default = "Same as the pages"
[[actions.params]]
id = "pages"
label = "Pages"
kind = "pages"
help = "Empty for all; for example 1-3, 7"
[[actions.params]]
id = "sheets"
label = "Which pages"
kind = "choice"
choices = ["All pages", "Odd pages only", "Even pages only"]
default = "All pages"
help = "For two-sided printing by hand: odd pages, turn the stack over, then even pages in reverse. A booklet's are its fronts and backs."
[[actions.params]]
id = "reverse"
label = "In reverse order"
kind = "bool"
[[actions.params]]
id = "content"
label = "Comments and forms"
kind = "choice"
choices = ["Document and comments", "Document only", "Document and stamps", "Form fields only"]
default = "Document and comments"
[[actions.params]]
id = "border"
label = "A border round each page (several per sheet)"
kind = "bool"
[[actions.params]]
id = "binding"
label = "Booklet binding"
kind = "choice"
choices = ["Left", "Right"]
default = "Left"
[[actions.params]]
id = "poster_scale"
label = "Poster size (%)"
kind = "integer"
default = 200
min = 10
max = 2000
[[actions.params]]
id = "cut_marks"
label = "Poster cut marks"
kind = "bool"
default = true
[[actions.params]]
id = "grayscale"
label = "Grayscale"
kind = "bool"
[[actions.params]]
id = "as_image"
label = "Print as image"
kind = "bool"
help = "For a printer that draws a page wrong: every page is rendered first"
[[actions.params]]
id = "dpi"
label = "Image resolution (DPI)"
kind = "integer"
default = 300
min = 72
max = 600

# Round 20 (#198): security. Each writes a new file beside the original.
[[actions]]
id = "protect"
title = "Protect with a password…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "open_password"
label = "Password to open it"
kind = "password"
help = "Leave empty to let anyone open it"
[[actions.params]]
id = "permissions_password"
label = "Permissions password"
kind = "password"
help = "Lifts the restrictions below"
[[actions.params]]
id = "allow_print"
label = "Allow printing"
kind = "bool"
default = true
[[actions.params]]
id = "allow_copy"
label = "Allow copying text"
kind = "bool"
default = true
[[actions.params]]
id = "allow_comments"
label = "Allow comments"
kind = "bool"
default = true
[[actions.params]]
id = "allow_forms"
label = "Allow filling forms"
kind = "bool"
default = true
[[actions.params]]
id = "allow_changes"
label = "Allow changes"
kind = "bool"
default = false
[[actions.params]]
id = "allow_pages"
label = "Allow taking pages apart or rearranging them"
kind = "bool"
default = false
[[actions.params]]
id = "encryption"
label = "Encryption"
kind = "choice"
choices = ["AES 256-bit", "AES 128-bit", "RC4 128-bit"]
default = "AES 256-bit"
[[actions.params]]
id = "leave_metadata"
label = "Leave the title and author readable"
kind = "bool"
default = false

[[actions]]
id = "remove-security"
title = "Remove security…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "password"
label = "Permissions password"
kind = "password"
help = "Or the password that opens it, when it has no restrictions"

[[actions]]
id = "redact"
title = "Redact…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "words"
label = "Words and phrases"
kind = "text"
help = "Separated by commas. Redaction marks already in the file are applied too."
[[actions.params]]
id = "emails"
label = "Email addresses"
kind = "bool"
[[actions.params]]
id = "phones"
label = "Phone numbers"
kind = "bool"
[[actions.params]]
id = "cards"
label = "Card numbers"
kind = "bool"
[[actions.params]]
id = "ssns"
label = "US Social Security numbers"
kind = "bool"
[[actions.params]]
id = "dates"
label = "Dates"
kind = "bool"
[[actions.params]]
id = "pages"
label = "Whole pages"
kind = "pages"
help = "For example 3, 7-9"
[[actions.params]]
id = "fill"
label = "Box colour"
kind = "choice"
choices = ["Black", "White"]
default = "Black"

[[actions]]
id = "remove-hidden"
title = "Remove hidden information…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "metadata"
label = "Metadata (title, author, dates, XMP)"
kind = "bool"
default = true
[[actions.params]]
id = "attachments"
label = "Attached files"
kind = "bool"
default = true
[[actions.params]]
id = "comments"
label = "Comments"
kind = "bool"
default = true
[[actions.params]]
id = "fields"
label = "Form fields (their look stays on the page)"
kind = "bool"
default = false
[[actions.params]]
id = "hidden_text"
label = "Invisible text"
kind = "bool"
default = true
[[actions.params]]
id = "hidden_layers"
label = "Hidden layers"
kind = "bool"
default = true
[[actions.params]]
id = "bookmarks"
label = "Bookmarks"
kind = "bool"
default = false
[[actions.params]]
id = "links"
label = "Links, actions and scripts"
kind = "bool"
default = true
[[actions.params]]
id = "private"
label = "Other programs' private data"
kind = "bool"
default = true

[[actions]]
id = "rewrite-clean"
title = "Save a clean copy"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"

[[actions]]
id = "extract-pages"
title = "Extract pages…"
icon = "file-send"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "pages"
label = "Pages"
kind = "pages"
required = true
help = "For example 1-3, 7, 10-"

[[actions]]
id = "reorder-pages"
title = "Reorder pages…"
icon = "sort-vertical"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "order"
label = "New order"
kind = "pages"
required = true
help = "For example 3, 1-2, 5 — pages left out follow in their order"

[[actions]]
id = "split-every"
title = "Split every N pages…"
icon = "scissors"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "every"
label = "Pages per part"
kind = "integer"
default = 10
min = 1

[[actions]]
id = "split-at"
title = "Split before pages…"
icon = "page-split-before"
extensions = ["pdf"]
files = "pdf"
[[actions.params]]
id = "at"
label = "Start a new part at"
kind = "pages"
required = true
help = "For example 5, 12"

[[actions]]
id = "merge"
title = "Merge with other PDFs…"
icon = "documents"
extensions = ["pdf"]
inputs = "many"
files = "pdf"
