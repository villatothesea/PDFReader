[package]
name = "mireader-reader-pdf"
description = "MiReader reader plugin: PDF, rasterised with hayro"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "mireader-reader-pdf"
path = "src/main.rs"

[dependencies]
# The SDK lives in the reader's repository, a sibling of this one:
# E:\Villa\VibeCoding\MimiReader\{MimiReader,PDFReader}.
mireader-reader-sdk = { path = "../MimiReader/crates/reader-sdk" }
hayro = "0.8"
# hayro's own version (no second copy): an embedded font's cmap, for text.
skrifa = "0.46"
# Item 19 (D53): editing in place — pdfcraft's object layer, comments and
# outline, pinned. None of these crates pulls in a renderer of its own.
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
# Round 19 (the corpus sweep, P2): field appearances for the drawn copy.
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
# Round 20 (#178): verifying a signature (never signing) — pdfcraft's
# validation over the file's own bytes.
pdfcraft-sign = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
# Round 20 (#198): redaction and hidden-information removal.
pdfcraft-crypt = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }
pdfcraft-redact = { git = "https://github.com/storytold/pdfcraft", rev = "3e968c8aa24adfb729c6d45a3c98abf5fed07027" }

[dev-dependencies]
mireader-reader-host = { path = "../MimiReader/crates/reader-host" }
png = "0.18"
tempfile = "3"
# Round 17 (O6): the page tools' job parameters in tests/organize.rs.
serde_json = "1"

# A workspace of its own, so cargo never looks for one in a parent folder.
[workspace]

# Round 19 (the corpus sweep): two of hayro's crates, vendored with small
# patches for the text layer. What changed, against which upstream version,
# and how to upgrade: vendor/PATCHES.md.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-cmap = { path = "vendor/hayro-cmap" }

# MimiReader round 18 (size lever 1): the release package's build — fat LTO
# and one codegen unit, as the main exe's `reader-dist`. `stage.ps1 -Dist`.
[profile.reader-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
